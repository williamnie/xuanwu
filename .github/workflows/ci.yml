name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and repository gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install backend dependencies
        run: bun install --cwd backend-ts --frozen-lockfile --ignore-scripts

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts

      - name: Run backend tests
        run: bun test --timeout 60000
        working-directory: backend-ts

      - name: Run repository script tests
        run: node --test scripts/*.test.mjs

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Audit repository hygiene
        run: node scripts/repository-hygiene-audit.mjs

      - name: Audit dependencies
        run: node scripts/dependency-security-audit.mjs

      - name: Check whitespace errors
        run: git diff --check
