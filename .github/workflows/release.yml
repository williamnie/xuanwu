name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with v"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend dependencies
        run: bun install --cwd backend-ts

      - name: Run backend tests
        run: bun test --timeout 60000
        working-directory: backend-ts

      - name: Package release assets
        env:
          CODEX_RUNNER_VERSION: ${{ steps.vars.outputs.tag }}
          CODEX_RUNNER_ENFORCE_RELEASE: '1'
        run: ./scripts/package-release.sh

      - name: Sign release provenance
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-checksums: dist/release/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/release/*.tar.gz dist/release/checksums.txt dist/release/release.json --clobber
          else
            gh release create "$TAG_NAME" dist/release/*.tar.gz dist/release/checksums.txt dist/release/release.json \
              --title "$TAG_NAME" \
              --generate-notes
          fi
