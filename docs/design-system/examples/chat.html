<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuanwu Design System — 对话工作台页面示例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  body { font-family: var(--font-display); background: var(--bg-primary); color: var(--text-primary); margin: 0; }
  .layout { display: flex; height: 100vh; }

  /* 侧边栏：允许玻璃拟态的三处之一 */
  .sidebar {
    backdrop-filter: saturate(140%) blur(12px);
    background: color-mix(in srgb, var(--bg-secondary) 88%, transparent);
    border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; flex-shrink: 0; gap: 4px;
    padding: 14px 10px; width: 246px;
  }
  .sidebar .brand { align-items: baseline; display: flex; gap: 8px; padding: 4px 8px 12px; }
  .sidebar .brand strong { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
  .sidebar .list { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; overflow-y: auto; }

  .main { display: flex; flex: 1; flex-direction: column; min-width: 0; }

  /* 页头：玻璃拟态允许处之二 */
  .topbar {
    align-items: center; backdrop-filter: saturate(140%) blur(12px);
    background: color-mix(in srgb, var(--bg-primary) 86%, transparent);
    border-bottom: 1px solid var(--border-light);
    display: flex; gap: 12px; justify-content: space-between; padding: 10px 20px;
  }
  .topbar .kicker { color: var(--primary); display: block; }
  .topbar h1 { font-size: 0.95rem; font-weight: 650; margin: 1px 0 0; }
  .topbar .actions { align-items: center; display: flex; gap: 8px; }

  .thread { display: flex; flex: 1; flex-direction: column; gap: 20px; margin: 0 auto; max-width: 780px; overflow-y: auto; padding: 24px 24px 16px; width: 100%; box-sizing: border-box; }
  .user-row { display: flex; justify-content: flex-end; }
  .assistant-body { font-size: 0.9rem; line-height: 1.75; margin-left: 34px; }
  .assistant-body code { background: var(--bg-secondary); border-radius: var(--radius-xs); font-family: var(--font-mono); font-size: 0.8rem; padding: 1px 5px; }

  .toolcard { background: var(--surface-raised); border: 1px solid var(--border-color); border-radius: var(--radius-md); margin: 10px 0 0 34px; }
  .toolcard-head { align-items: center; display: flex; gap: 8px; justify-content: space-between; padding: 8px 12px; }
  .toolcard-head .name { align-items: center; color: var(--text-secondary); display: flex; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; gap: 7px; }
  .toolcard .ds-terminal { border: 0; border-radius: 0; border-top: 1px solid var(--border-color); }

  /* 输入器：玻璃拟态允许处之三 + radius-lg 例外 */
  .composer-wrap { padding: 0 24px 20px; }
  .composer-inner { margin: 0 auto; max-width: 780px; }

  @media (max-width: 980px) {
    .sidebar { width: 210px; }
  }
  @media (max-width: 760px) {
    .layout { height: auto; min-height: 100vh; }
    .sidebar { display: none; }
    .topbar { padding-inline: 12px; }
    .thread { padding: 18px 12px 14px; }
    .composer-wrap { padding: 0 12px 12px; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <strong>玄武</strong>
      <span class="ds-mono-label">XUANWU</span>
    </div>
    <button class="ds-btn ds-btn--new" style="justify-content:center;">+ New Chat</button>
    <div class="list">
      <button class="ds-nav-item active"><span class="t">优化登录页性能</span><span class="m">demo-project · 10:42</span></button>
      <button class="ds-nav-item"><span class="t">重构 evidence panel</span><span class="m">demo-project · 昨天</span></button>
      <button class="ds-nav-item"><span class="t">梳理 run 详情页信息层级</span><span class="m">codex-issue-runner · 03/12</span></button>
    </div>
    <div style="flex:1"></div>
    <button class="ds-btn ds-btn--sm" onclick="toggleTheme()">切换主题</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <span class="ds-mono-label kicker">工作区 / DEMO-PROJECT</span>
        <h1>优化登录页性能</h1>
      </div>
      <div class="actions">
        <span class="ds-status-pill" data-tone="running">sending</span>
        <button class="ds-icon-btn" title="复制调试信息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </header>

    <div class="thread">
      <div class="user-row">
        <div class="ds-bubble ds-bubble--user">
          <div class="ds-msg-head"><span class="ds-role" style="color:var(--text-muted)">你</span></div>
          <div style="font-size:0.88rem;">@issue-13 登录接口 P95 超过 900ms，帮我定位并给出最小修复。</div>
        </div>
      </div>

      <div>
        <div class="ds-msg-head">
          <span class="ds-avatar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></span>
          <span class="ds-role" style="color:var(--primary)">XUANWU</span>
        </div>
        <div class="assistant-body">
          已复现：慢在会话校验里的 N+1 查询，证据见 <code>auth/session.ts:118</code>。先跑一轮基准确认：
        </div>
        <div class="toolcard">
          <div class="toolcard-head">
            <span class="name"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>BASH · bench:login</span>
            <span class="ds-status-pill" data-tone="ok">exit 0</span>
          </div>
          <div class="ds-terminal">
            <pre class="ds-terminal-body"><span class="dim">$ </span>bun run bench:login
p50 <span class="ok">182ms</span> · p95 <span class="err">912ms</span> · p99 <span class="err">1.2s</span>
<span class="dim">queries/request: 48 (expect ~6)</span></pre>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer-inner">
        <div class="ds-composer">
          <textarea placeholder="尽管问 — @ 引用 issue / run / 文件"></textarea>
          <div class="ds-composer-foot">
            <span class="ds-chip-select">gpt-5 · high<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>
            <span class="spacer"></span>
            <span class="ds-mono-label">ENTER 发送</span>
            <button class="ds-send" title="发送"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  function toggleTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    if (dark) { delete document.documentElement.dataset.theme; localStorage.setItem('ds-theme', ''); }
    else { document.documentElement.dataset.theme = 'dark'; localStorage.setItem('ds-theme', 'dark'); }
  }
  const saved = localStorage.getItem('ds-theme');
  if (saved) document.documentElement.dataset.theme = saved;
</script>
</body>
</html>
